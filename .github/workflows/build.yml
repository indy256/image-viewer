name: CMake build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-fast:
    name: Build (Windows x64, prebuilt Qt, no LTO)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install prebuilt Qt
        uses: jurplel/install-qt-action@v4
        with:
          # aqtinstall 3.3 cannot resolve Qt 6.11's split repository layout.
          version: '6.8.3'
          arch: win64_msvc2022_64
          archives: qtbase
          cache: true

      - name: Set up MSVC
        shell: pwsh
        run: ./scripts/setup-msvc.ps1 -Architecture x64

      - name: Install assembler
        shell: pwsh
        run: |
          choco install nasm --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:ProgramFiles\NASM" >> $env:GITHUB_PATH

      - name: Build and deploy portable application
        shell: pwsh
        run: |
          & "$env:QT_ROOT_DIR/bin/qt-cmake.bat" -S . -B build-fast -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DIMAGE_VIEWER_LTO=OFF -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF -DIMAGE_VIEWER_STATIC_RUNTIME=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-fast --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --install build-fast --prefix "$PWD/dist/windows-x64-fast"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload portable application
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64-fast
          path: dist/windows-x64-fast/
          compression-level: 0
          if-no-files-found: error

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ startsWith(matrix.os, 'windows-') && 120 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, windows-11-arm, macos-latest]
        include:
          - os: ubuntu-latest
            qt-version: '6.8.3'
            package-format: TGZ
            artifact-path: dist/iv-Linux-X64.AppImage
          - os: windows-latest
            msvc-arch: x64
            qt-version: '6.11.2'
            package-format: ZIP
            artifact-path: dist/iv-Windows-X64.exe
          - os: windows-11-arm
            msvc-arch: arm64
            qt-version: '6.11.2'
            package-format: ZIP
            artifact-path: dist/iv-Windows-ARM64.exe
          - os: macos-latest
            # Qt 6.8.3 links AGL, which newer macOS SDKs no longer provide.
            qt-version: '6.11.2'
            package-format: DragNDrop
            artifact-path: dist/iv-macOS-ARM64.dmg

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Qt
        if: runner.os != 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt-version }}
          cache: true

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm perl libopengl0 libglvnd0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0

      - name: Set up MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/setup-msvc.ps1 -Architecture ${{ matrix.msvc-arch }}

      - name: Install Windows build tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:RUNNER_ARCH -eq 'X64') {
            choco install nasm --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            "$env:ProgramFiles\NASM" >> $env:GITHUB_PATH
          }
          Get-Command cmake, ninja, perl, cl

      - name: Identify Windows toolchain
        if: runner.os == 'Windows'
        id: toolchain
        shell: pwsh
        run: |
          $compilerHash = (Get-FileHash (Get-Command cl.exe).Source -Algorithm SHA256).Hash
          $sdkVersion = $env:WindowsSDKVersion.TrimEnd('\')
          "key=msvc-$env:VCToolsVersion-$sdkVersion-$compilerHash" >> $env:GITHUB_OUTPUT

      - name: Cache static Qt with LTO
        if: runner.os == 'Windows'
        id: qt-lto
        uses: actions/cache@v5
        with:
          path: .qt-lto
          key: qt-lto-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('scripts/build-qt-windows.ps1') }}

      - name: Build static Qt with LTO
        if: runner.os == 'Windows' && steps.qt-lto.outputs.cache-hit != 'true'
        shell: pwsh
        run: >-
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/build-qt-windows.ps1
          -Toolchain MSVC -WorkDirectory "$env:RUNNER_TEMP/qt-lto"
          -InstallDirectory "$env:GITHUB_WORKSPACE/.qt-lto" -Parallel 2

      - name: Configure
        if: runner.os != 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        if: runner.os != 'Windows'
        # Bare --parallel gives Unix Makefiles unlimited jobs and can exhaust runner memory.
        run: cmake --build build --config Release --parallel 2

      - name: Build standalone Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ARTIFACT_PATH: ${{ matrix.artifact-path }}
        run: |
          & ./.qt-lto/bin/qt-cmake.bat -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DIMAGE_VIEWER_STATIC_RUNTIME=ON -DIMAGE_VIEWER_LTO=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/iv.exe $env:ARTIFACT_PATH
          $headers = & dumpbin /HEADERS $env:ARTIFACT_PATH
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $machine = if ($env:RUNNER_ARCH -eq 'ARM64') { 'AA64' } else { '8664' }
          if (-not ($headers -match "(?i)\b$machine machine")) {
            throw "Executable does not match runner architecture: $env:RUNNER_ARCH"
          }
          $dependencies = & dumpbin /DEPENDENTS $env:ARTIFACT_PATH
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dependencies
          if ($dependencies -match '(?i)(Qt6|libgcc|libstdc\+\+|libwinpthread|VCRUNTIME\d|MSVCP\d|CONCRT\d|ucrtbased)') {
            throw 'Unexpected runtime DLL dependency'
          }

      - name: Package application and Qt runtime
        if: runner.os == 'macOS'
        run: >-
          cpack --config build/CPackConfig.cmake -C Release
          -G ${{ matrix.package-format }} -B dist
          -D CPACK_PACKAGE_FILE_NAME=iv-${{ runner.os }}-${{ runner.arch }}

      - name: Build Linux AppImage
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          ARCH: x86_64
        run: |
          cmake --install build --prefix "$PWD/AppDir/usr"
          if find AppDir -name 'libc.so.*' -o -name 'ld-linux*.so.*' -o -name 'libpthread.so.*' | grep -q .; then
            echo 'AppImage must use the host glibc and ELF loader'
            exit 1
          fi
          test -e AppDir/usr/lib/libOpenGL.so.0
          test -e AppDir/usr/lib/libGLdispatch.so.0
          test -e AppDir/usr/lib/libxcb-cursor.so.0
          test -e AppDir/usr/lib/libxkbcommon-x11.so.0
          test -e AppDir/usr/plugins/platforms/libqxcb.so
          while IFS= read -r -d '' plugin; do
            dependencies=$(LD_LIBRARY_PATH="$PWD/AppDir/usr/lib" ldd "$plugin")
            if [[ "$dependencies" == *'not found'* ]]; then
              printf 'Unresolved dependencies in %s:\n%s\n' "$plugin" "$dependencies"
              exit 1
            fi
          done < <(find AppDir/usr/plugins -type f -name '*.so' -print0)
          cp /usr/share/doc/libopengl0/copyright AppDir/usr/licenses/libglvnd.txt
          cp packaging/AppRun AppDir/AppRun
          cp packaging/image-viewer.desktop packaging/image-viewer.png AppDir/
          chmod +x AppDir/AppRun
          curl -fL --retry 3 -o appimagetool.AppImage https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          mkdir -p dist
          ./appimagetool.AppImage AppDir dist/iv-Linux-X64.AppImage
          chmod 755 dist/iv-Linux-X64.AppImage

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          path: ${{ matrix.artifact-path }}
          archive: false
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          pattern: iv*
          path: dist
          merge-multiple: true
          skip-decompress: true

      - name: Create release and upload binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes
          fi
