name: CMake build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            qt-version: '6.8.3'
            package-format: TGZ
          - os: windows-latest
            qt-version: '6.8.3'
            package-format: ZIP
          - os: macos-latest
            # Qt 6.8.3 links AGL, which newer macOS SDKs no longer provide.
            qt-version: '6.11.2'
            package-format: ZIP

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Qt
        if: runner.os != 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt-version }}
          cache: true

      - name: Install static Qt and compiler on Windows
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-static

      - name: Configure
        if: runner.os != 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        if: runner.os != 'Windows'
        run: cmake --build build --config Release --parallel

      - name: Build standalone Windows executable
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=/ucrt64/qt6-static
          cmake --build build --parallel
          mkdir -p dist
          cp build/image-viewer.exe dist/image-viewer-Windows-X64.exe
          objdump -p dist/image-viewer-Windows-X64.exe | grep 'DLL Name:'
          if objdump -p dist/image-viewer-Windows-X64.exe | grep -Ei 'DLL Name:.*(Qt6|libgcc|libstdc\+\+|libwinpthread)'; then
            echo 'Unexpected runtime DLL dependency'
            exit 1
          fi

      - name: Check Windows executable without Qt on PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          Remove-Item Env:QT_PLUGIN_PATH -ErrorAction SilentlyContinue
          $viewer = Start-Process -FilePath "$PWD/dist/image-viewer-Windows-X64.exe" -WindowStyle Hidden -PassThru
          try {
            Start-Sleep -Seconds 2
            if ($viewer.HasExited) { throw "Viewer exited during startup: $($viewer.ExitCode)" }
          } finally {
            if (-not $viewer.HasExited) { Stop-Process -Id $viewer.Id }
          }

      - name: Package application and Qt runtime
        if: runner.os == 'macOS'
        run: >-
          cpack --config build/CPackConfig.cmake -C Release
          -G ${{ matrix.package-format }} -B dist
          -D CPACK_PACKAGE_FILE_NAME=image-viewer-${{ runner.os }}-${{ runner.arch }}

      - name: Build Linux AppImage
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          ARCH: x86_64
        run: |
          cmake --install build --prefix "$PWD/AppDir/usr"
          cp packaging/AppRun AppDir/AppRun
          cp packaging/image-viewer.desktop packaging/image-viewer.svg AppDir/
          chmod +x AppDir/AppRun
          curl -fL --retry 3 -o appimagetool.AppImage https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          mkdir -p dist
          ./appimagetool.AppImage AppDir dist/image-viewer-Linux-X64.AppImage

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: image-viewer-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: image-viewer-*
          path: dist
          merge-multiple: true

      - name: Create release and upload binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes
          fi
